[tool.poetry]
name = "bank-widget"
version = "0.1.0"
description = ""
authors = ["Samum <mariakhusainova9@gmail.com>"]
readme = "README.md"

packages = [
    { include = "src", from = "." },
    { include = "generators", from = "." },
]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.32.0"
python-dotenv = "^1.0.1"
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
flake8 = "^7.0.0"
isort = "^6.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]

[tool.flake8]
max-line-length = 119
exclude = ".venv, .idea, __pycache__, build, dist"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.isort]
profile = "black"
line_length = 120
skip_glob = ["*_disabled.py"]
