[tool.poetry]
name = "bank-widget"
version = "0.1.0"
description = ""
authors = ["Samum <mariakhusainova9@gmail.com>"]
readme = "README.md"

packages = [
    { include = "src", from = "." },
    { include = "generators", from = "." },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
flake8 = "^7.0.0"
mypy = "^1.8.0"
isort = "^5.13.0"
black = "^24.0.0"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
# Можно оставить пустым, если используешь настройки по умолчанию

[tool.isort]
profile = "black"
line_length = 119
skip = [".venv", ".idea", "__pycache__", "build", "dist"]

[tool.flake8]
max-line-length = 119
exclude = ".venv, .idea, __pycache__, build, dist"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true